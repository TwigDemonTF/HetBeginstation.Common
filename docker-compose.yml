version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  publisher-api:
    build:
      context: .
      dockerfile: PublisherAPI/Dockerfile
    container_name: publisher-api
    ports:
      - "8080:80"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq

  consumer-service:
    build:
      context: .
      dockerfile: ConsumerAPI/Dockerfile
    container_name: consumer-service
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq

volumes:
  rabbitmq_data: